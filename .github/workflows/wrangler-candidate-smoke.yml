name: Verify retained Wrangler candidate

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Wrangler diagnostic artifact from a completed main build"
        required: true
        type: string
      source_sha:
        description: "Full source commit of the retained candidate"
        required: true
        type: string
      artifact_sha256:
        description: "Expected SHA-256 of the GitHub artifact ZIP"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  native-termux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      # Match the image used to build and test the retained 2026-11-07 candidate.
      TERMUX_IMAGE: termux/termux-docker@sha256:070632a59051dbaf9e3edc7d74cbdbac9d906c8cb65b91ece3af8186c3ea4f99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify candidate provenance and download exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p evidence candidate
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > evidence/artifact.json
          run_id=$(jq -er '.workflow_run.id' evidence/artifact.json)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > evidence/source-run.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = json.loads(Path("evidence/artifact.json").read_text())
          run = json.loads(Path("evidence/source-run.json").read_text())
          assert artifact["name"] == "wrangler-aarch64-diagnostics"
          assert not artifact["expired"]
          assert artifact["digest"] == "sha256:" + os.environ["ARTIFACT_SHA256"]
          assert artifact["workflow_run"]["head_sha"] == os.environ["SOURCE_SHA"]
          assert run["head_sha"] == os.environ["SOURCE_SHA"]
          assert run["head_branch"] == "main" and run["status"] == "completed"
          assert run["repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          assert run["path"] == ".github/workflows/daily-build.yml"
          assert run["event"] in {"schedule", "workflow_dispatch"}
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > candidate.zip
          printf '%s  candidate.zip\n' "$ARTIFACT_SHA256" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import re
          import zipfile

          with zipfile.ZipFile("candidate.zip") as archive:
              members = archive.infolist()
              assert len(members) == 1
              member = members[0]
              assert re.fullmatch(r"wrangler_[0-9.]+_aarch64\.deb", member.filename)
              assert not member.is_dir()
              Path("candidate", member.filename).write_bytes(archive.read(member))
          PY
          deb=(candidate/*.deb)
          test "$(dpkg-deb -f "${deb[0]}" Package)" = wrangler
          test "$(dpkg-deb -f "${deb[0]}" Architecture)" = aarch64
          sha256sum "${deb[0]}" | tee evidence/package.sha256
          dpkg-deb -x "${deb[0]}" package-inspect
          metadata=package-inspect/data/data/com.termux/files/usr/share/doc/wrangler/BUILD-METADATA.txt
          cp "$metadata" evidence/BUILD-METADATA.txt
          wrangler=$(sed -n 's/^Wrangler: //p' "$metadata")
          workerd=$(sed -n 's/^workerd: //p' "$metadata")
          esbuild=$(sed -n 's/^esbuild: //p' "$metadata")
          for version in "$wrangler" "$workerd" "$esbuild"; do
            [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          done
          test "$(dpkg-deb -f "${deb[0]}" Version)" = "$wrangler"
          printf 'WRANGLER_VERSION=%s\nWORKERD_VERSION=%s\nESBUILD_VERSION=%s\n' \
            "$wrangler" "$workerd" "$esbuild" >> "$GITHUB_ENV"

      - name: Verify identical image on native ARM64 hardware
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = aarch64
          docker pull "$TERMUX_IMAGE"
          test "$(docker image inspect --format '{{.Architecture}}' "$TERMUX_IMAGE")" = arm64
          docker image inspect "$TERMUX_IMAGE" > evidence/container-image.json

      - name: Run unchanged package smoke on native ARM64
        run: |
          set -Eeuo pipefail
          chmod -R a+rX candidate
          docker run --name wrangler-smoke \
            --security-opt seccomp=unconfined \
            -v "$PWD:/work:ro" \
            "$TERMUX_IMAGE" \
            /entrypoint.sh bash /work/scripts/test_wrangler_termux.sh \
            "/work/candidate/wrangler_${WRANGLER_VERSION}_aarch64.deb" \
            "$WRANGLER_VERSION" "$WORKERD_VERSION" "$ESBUILD_VERSION" \
            2>&1 | tee evidence/native-smoke.log

      - name: Retain runtime diagnostics
        if: ${{ always() }}
        run: |
          docker cp wrangler-smoke:/data/data/com.termux/files/home/wrangler-termux-smoke evidence/smoke || true
          docker rm -f wrangler-smoke || true

      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: wrangler-native-smoke-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 14
