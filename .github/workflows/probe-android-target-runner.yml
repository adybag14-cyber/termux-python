name: Probe Android target runner
on:
  push:
    branches: [probe-android-runner]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build Android aarch64 test executable
        shell: bash
        run: |
          set -Eeuo pipefail
          ndk=$(find /usr/local/lib/android/sdk/ndk -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          cat > hello.c <<'C'
          #include <stdio.h>
          int main(int argc, char** argv) {
            if (argc != 2) return 2;
            FILE* list = fopen(argv[1], "r");
            if (!list) return 3;
            char in[4096], out[4096];
            while (fscanf(list, "%4095s %4095s", in, out) == 2) {
              FILE* f = fopen(out, "w");
              if (!f) return 4;
              fprintf(f, "android-runner-ok input=%s\n", in);
              fclose(f);
            }
            fclose(list);
            return 0;
          }
          C
          "$clang" hello.c -o hello
          file hello
          readelf -l hello | grep -E 'interpreter|Requesting'
          printf 'hello.c generated.out\n' > manifest.txt
      - name: Run Android executable through Termux container wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull --platform linux/arm64 termux/termux-docker:aarch64
          cat > /usr/local/bin/workerd-android-run-under <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          tool=$1
          shift
          here=$PWD
          manifest=${1:-}
          [[ -f "$manifest" ]] || { echo "expected compile-cache manifest as first argument: $manifest" >&2; exit 2; }
          staged_tool=$(mktemp -p "$here" .android-runner-tool.XXXXXX)
          staged_manifest=$(mktemp -p "$here" .android-runner-manifest.XXXXXX)
          staged_inputs=()
          outputs=()
          cleanup() {
            rm -f "$staged_tool" "$staged_manifest"
            if ((${#staged_inputs[@]})); then rm -f "${staged_inputs[@]}"; fi
          }
          trap cleanup EXIT
          cp -L "$tool" "$staged_tool"
          chmod a+rx "$staged_tool"
          index=0
          while read -r input output; do
            [[ -n "${input:-}" && -n "${output:-}" ]] || continue
            staged_input="$here/.android-runner-input.$index"
            cp -L "$input" "$staged_input"
            chmod a+r "$staged_input"
            staged_inputs+=("$staged_input")
            outputs+=("$output")
            mkdir -p "$(dirname "$output")"
            : > "$output"
            chmod a+rw "$output"
            printf '%s %s\n' "$staged_input" "$output" >> "$staged_manifest"
            index=$((index + 1))
          done < "$manifest"
          chmod a+r "$staged_manifest"
          docker run --rm --platform linux/arm64 \
            -v "$here:$here" -w "$here" \
            termux/termux-docker:aarch64 \
            "$staged_tool" "$staged_manifest"
          for output in "${outputs[@]}"; do
            [[ -e "$output" ]] || { echo "Android tool did not produce $output" >&2; exit 1; }
          done
          SH
          chmod +x /usr/local/bin/workerd-android-run-under
          /usr/local/bin/workerd-android-run-under ./hello manifest.txt
          test "$(stat -c %u generated.out)" = "$(id -u)"
          grep -F 'android-runner-ok input=' generated.out
