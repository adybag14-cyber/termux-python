name: Probe workerd Android analysis
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Enable aarch64 containers through QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Clone and patch exact workerd
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --depth=1 --branch v1.20260801.1 https://github.com/cloudflare/workerd.git workerd
          python3 scripts/patch_workerd_android.py workerd
          grep -A4 -F 'name = "rust_cc_common_link"' workerd/build/config/BUILD.bazel \
            | grep -F 'constraint_values = ["@platforms//os:android"]'
      - name: Install workerd host LLVM 19 toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          curl -fsSL --retry 4 --retry-all-errors https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sed -i '/apt-get install/d' /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19
          sudo apt-get install -y -qq --no-install-recommends \
            clang-19 \
            lld-19 \
            libunwind-19 \
            libc++abi1-19 \
            libc++1-19 \
            libc++-19-dev \
            libclang-rt-19-dev \
            llvm-19
          /usr/lib/llvm-19/bin/clang --version
          /usr/lib/llvm-19/bin/ld.lld --version
      - name: Prepare NDK, Bazelisk, and Android runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          GOBIN="$HOME/.local/bin" go install github.com/bazelbuild/bazelisk@latest
          sudo install -m 0755 scripts/run_workerd_android_target_tool.sh /usr/local/bin/workerd-android-run-under
          docker pull --platform linux/arm64 termux/termux-docker:aarch64
          builtins=$(find "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt" -type f \
            -name 'libclang_rt.builtins-aarch64-android.a' -print -quit)
          test -n "$builtins"
          ndk_llvm_nm="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$ndk_llvm_nm" --defined-only "$builtins" | grep -E '(^|[[:space:]])__clear_cache$'
      - name: Build Android gen-compile-cache through the NDK C++ linker
        working-directory: workerd
        shell: bash
        run: |
          set -Eeuo pipefail
          "$HOME/.local/bin/bazelisk" build //src/rust/gen-compile-cache:gen-compile-cache \
            --enable_platform_specific_config=false \
            --config=release_android \
            --platforms=//:android_arm64 \
            --jobs=4 \
            --verbose_failures
      - name: Verify and execute gen-compile-cache in Termux
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          cp workerd/bazel-bin/src/rust/gen-compile-cache/gen-compile-cache dist/gen-compile-cache
          chmod 0755 dist/gen-compile-cache
          file dist/gen-compile-cache
          readelf -h dist/gen-compile-cache | grep -E 'Machine:[[:space:]]+AArch64'
          readelf -l dist/gen-compile-cache | grep -E 'Requesting program interpreter: /system/bin/linker64'
          if readelf -d dist/gen-compile-cache | grep -F 'libc.so.6'; then
            echo 'glibc dependency detected' >&2
            exit 1
          fi
          if readelf -l dist/gen-compile-cache | grep -E 'ld-linux|ld-musl'; then
            echo 'non-Android ELF interpreter detected' >&2
            exit 1
          fi
          printf 'export default 1;\n' > dist/input.mjs
          printf '/probe/input.mjs /probe/output.bin\n' > dist/manifest.txt
          chmod 0777 dist
          chmod a+r dist/input.mjs dist/manifest.txt
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE/dist:/probe" \
            termux/termux-docker:aarch64 \
            /probe/gen-compile-cache /probe/manifest.txt
          test -s dist/output.bin
          file dist/output.bin
          sha256sum dist/gen-compile-cache dist/output.bin
          echo android-gen-compile-cache-real-link-and-runtime-ok