name: Probe workerd Android analysis
on:
  push:
    branches: [probe-android-runner]
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Clone and patch exact workerd
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --depth=1 --branch v1.20260801.1 https://github.com/cloudflare/workerd.git workerd
          python3 scripts/patch_workerd_android.py workerd
          grep -F 'build:android --//build/config:target_run_under=/usr/local/bin/workerd-android-run-under' workerd/.bazelrc
          grep -F 'cfg = "target"' workerd/build/wd_js_bundle.bzl
      - name: Select NDK and Bazelisk
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          GOBIN="$HOME/.local/bin" go install github.com/bazelbuild/bazelisk@latest
          sudo install -m 0755 scripts/run_workerd_android_target_tool.sh /usr/local/bin/workerd-android-run-under
      - name: Analyze full Android action graph
        working-directory: workerd
        shell: bash
        run: |
          set -Eeuo pipefail
          common=(
            --enable_platform_specific_config=false
            --config=release_android
            --platforms=//:android_arm64
          )
          "$HOME/.local/bin/bazelisk" aquery //src/workerd/server:workerd "${common[@]}" --output=text > "$RUNNER_TEMP/workerd-aquery.txt"
          grep -F '/usr/local/bin/workerd-android-run-under' "$RUNNER_TEMP/workerd-aquery.txt" | head -5
          grep -F 'gen-compile-cache' "$RUNNER_TEMP/workerd-aquery.txt" | head -10
          python3 - "$RUNNER_TEMP/workerd-aquery.txt" <<'PY'
          import sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          blocks = text.split("action '")
          embed = [b for b in blocks if 'icu-data-file.embed.c' in b and 'CppCompile' in b]
          if not embed:
              raise SystemExit('no ICU embed C++ compile action found')
          print(f'icu-embed-actions={len(embed)}')
          for b in embed:
              head = b[:12000]
              if '/usr/bin/clang ' in head and '--embed-dir=' in head:
                  raise SystemExit('ICU #embed leaked into stock host /usr/bin/clang')
          if 'workerd-android-run-under' not in text:
              raise SystemExit('Android target_run_under wrapper missing from full action graph')
          print('android-action-graph-ok')
          PY