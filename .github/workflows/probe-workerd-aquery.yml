name: Probe workerd Android analysis
on:
  push:
    branches: [probe-android-runner]
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Clone and patch exact workerd
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --depth=1 --branch v1.20260801.1 https://github.com/cloudflare/workerd.git workerd
          python3 scripts/patch_workerd_android.py workerd
          grep -F 'build:android --//build/config:target_run_under=/usr/local/bin/workerd-android-run-under' workerd/.bazelrc
          grep -F 'cfg = "target"' workerd/build/wd_js_bundle.bzl
      - name: Select NDK and Bazelisk
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          GOBIN="$HOME/.local/bin" go install github.com/bazelbuild/bazelisk@latest
          sudo install -m 0755 scripts/run_workerd_android_target_tool.sh /usr/local/bin/workerd-android-run-under
      - name: Analyze full Android action graph
        working-directory: workerd
        shell: bash
        run: |
          set -Eeuo pipefail
          common=(
            --enable_platform_specific_config=false
            --config=release_android
            --platforms=//:android_arm64
          )
          "$HOME/.local/bin/bazelisk" aquery 'deps(//src/per_isolate:per_isolate@compile_cache)' "${common[@]}" --output=text > "$RUNNER_TEMP/compile-cache-aquery.txt"
          grep -F '/usr/local/bin/workerd-android-run-under' "$RUNNER_TEMP/compile-cache-aquery.txt" | head -5 || true
          grep -F 'gen-compile-cache' "$RUNNER_TEMP/compile-cache-aquery.txt" | head -10 || true
          grep -F 'icu-data-file.embed.c' "$RUNNER_TEMP/compile-cache-aquery.txt" | head -10 || true
          if grep -F '/usr/bin/clang ' "$RUNNER_TEMP/compile-cache-aquery.txt" | grep -F -- '--embed-dir=' >/dev/null; then
            echo 'ICU #embed leaked into stock host /usr/bin/clang' >&2
            exit 1
          fi
          grep -F '/usr/local/bin/workerd-android-run-under' "$RUNNER_TEMP/compile-cache-aquery.txt" >/dev/null
          echo android-action-graph-ok
