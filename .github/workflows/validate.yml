name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile Python scripts
        run: python3 -m compileall -q scripts

      - name: Check shell syntax
        run: bash -n install.sh scripts/*.sh

      - name: Validate JSON configuration
        run: python3 -m json.tool config/series.json >/dev/null

      - name: Resolve one live Python series
        run: python3 scripts/resolve_versions.py --series 3.14 --write /tmp/resolved.json

      - name: Parse generated historical recipe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from scripts.prepare_python_recipe import modernize_recipe

          sample = '''TERMUX_PKG_LICENSE="PythonPL"
          TERMUX_PKG_VERSION="3.9.7"
          termux_step_pre_configure() {
              :
          }
          termux_step_create_debscripts() { :; }
          '''
          generated = modernize_recipe(sample, "3.9")
          assert 'CPPFLAGS+=" -I$TERMUX_PREFIX/include"' in generated
          assert 'LDFLAGS+=" -L$TERMUX_PREFIX/lib -lm"' in generated
          Path("/tmp/generated-build.sh").write_text(generated, encoding="utf-8")
          PY
          bash -n /tmp/generated-build.sh

      - name: Exercise release index generation
        run: |
          mkdir -p /tmp/assets /tmp/index
          : > /tmp/assets/python_3.14.6-1_aarch64.deb
          : > /tmp/assets/python-ensurepip-wheels_3.14.6-1_all.deb
          : > /tmp/assets/uv_0.11.29_aarch64.deb
          : > /tmp/assets/psutil-7.2.2-314-cp36-abi3-android_24_arm64_v8a.whl
          python3 scripts/generate_release_index.py \
            --repo example/example \
            --tag test-immutable-tag \
            --assets /tmp/assets \
            --output /tmp/index
          grep -q $'python\t3.14' /tmp/index/release-index.tsv
          grep -q $'ensurepip\t3.14' /tmp/index/release-index.tsv
          grep -q $'psutil\t3.14' /tmp/index/release-index.tsv
          grep -q 'psutil-7.2.2-314-cp36-abi3-android_24_arm64_v8a.whl' /tmp/index/release-index.tsv

      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f, aliases: true) }'

  probe-workerd-android:
    if: github.ref == 'refs/heads/wrangler-android-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Wrangler native versions
        id: versions
        run: |
          set -Eeuo pipefail
          wrangler=$(curl -fsSL https://registry.npmjs.org/wrangler/latest | jq -r .version)
          test -n "$wrangler" -a "$wrangler" != null
          git clone --filter=blob:none --depth=1 --branch "wrangler@$wrangler" \
            https://github.com/cloudflare/workers-sdk.git workers-sdk
          workerd=$(sed -n 's/^  workerd: "\([^"]*\)"/\1/p' workers-sdk/pnpm-workspace.yaml | head -n1)
          esbuild=$(sed -n 's/^  esbuild: "\([^"]*\)"/\1/p' workers-sdk/pnpm-workspace.yaml | head -n1)
          test -n "$workerd" -a -n "$esbuild"
          printf 'wrangler=%s\nworkerd=%s\nesbuild=%s\n' "$wrangler" "$workerd" "$esbuild"
          echo "wrangler=$wrangler" >> "$GITHUB_OUTPUT"
          echo "workerd=$workerd" >> "$GITHUB_OUTPUT"
          echo "esbuild=$esbuild" >> "$GITHUB_OUTPUT"

      - name: Clone and patch exact workerd source
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --depth=1 --branch "v${{ steps.versions.outputs.workerd }}" \
            https://github.com/cloudflare/workerd.git workerd
          python3 scripts/patch_workerd_android.py workerd

      - name: Select Android NDK and Bazelisk
        run: |
          set -Eeuo pipefail
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          GOBIN="$HOME/.local/bin" go install github.com/bazelbuild/bazelisk@latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build workerd from source for Android aarch64
        working-directory: workerd
        run: |
          set -Eeuo pipefail
          "$HOME/.local/bin/bazelisk" version
          "$HOME/.local/bin/bazelisk" build //src/workerd/server:workerd \
            --config=release_android \
            --platforms=//:android_arm64 \
            --jobs=4 \
            --verbose_failures

      - name: Verify target binary
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          cp workerd/bazel-bin/src/workerd/server/workerd dist/workerd-android-aarch64
          file dist/workerd-android-aarch64
          readelf -h dist/workerd-android-aarch64
          if readelf -d dist/workerd-android-aarch64 | grep -F 'libc.so.6'; then
            echo 'glibc dependency detected; refusing non-Android artifact' >&2
            exit 1
          fi
          sha256sum dist/workerd-android-aarch64

      - uses: actions/upload-artifact@v6
        with:
          name: workerd-android-aarch64
          path: dist/workerd-android-aarch64
          if-no-files-found: error
          retention-days: 3
