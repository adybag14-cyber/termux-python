name: Probe Bazel Android wrapper sandbox
on:`n  workflow_dispatch:`njobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build Android tool and Bazel fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull --platform linux/arm64 termux/termux-docker:aarch64
          sudo install -m 0755 scripts/run_workerd_android_target_tool.sh /usr/local/bin/workerd-android-run-under
          ndk=$(find /usr/local/lib/android/sdk/ndk -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          rm -rf bazel-wrapper-probe
          mkdir bazel-wrapper-probe
          cd bazel-wrapper-probe
          cat > hello.c <<'C'
          #include <stdio.h>
          int main(int argc, char** argv) {
            if (argc != 2) return 2;
            FILE* list = fopen(argv[1], "r");
            if (!list) return 3;
            char in[4096], out[4096];
            while (fscanf(list, "%4095s %4095s", in, out) == 2) {
              FILE* source = fopen(in, "r");
              if (!source) return 4;
              int ch = fgetc(source);
              fclose(source);
              FILE* result = fopen(out, "w");
              if (!result) return 5;
              fprintf(result, "bazel-android-wrapper-ok first=%d\n", ch);
              fclose(result);
            }
            return 0;
          }
          C
          "$clang" hello.c -o hello
          chmod +x hello
          printf 'source-data\n' > input.txt
          printf 'module(name = "android_wrapper_probe")\n' > MODULE.bazel
          cat > BUILD.bazel <<'BZL'
          exports_files(["hello", "input.txt"])
          genrule(
              name = "run_android",
              srcs = ["hello", "input.txt"],
              outs = ["generated.out"],
              cmd = """
                manifest=$(@D)/android-manifest.txt
                printf '%s %s\n' '$(location input.txt)' '$@' > $$manifest
                /usr/local/bin/workerd-android-run-under '$(location hello)' $$manifest
              """,
          )
          BZL
      - name: Execute wrapper from Bazel linux-sandbox
        working-directory: bazel-wrapper-probe
        shell: bash
        run: |
          set -Eeuo pipefail
          GOBIN="$HOME/.local/bin" go install github.com/bazelbuild/bazelisk@latest
          "$HOME/.local/bin/bazelisk" build //:run_android --spawn_strategy=sandboxed --verbose_failures
          cat bazel-bin/generated.out
          grep -F 'bazel-android-wrapper-ok' bazel-bin/generated.out
          echo bazel-sandbox-android-wrapper-ok
